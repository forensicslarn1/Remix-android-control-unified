name: Cross-platform desktop build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive: android-control-center-windows-x64.zip
          - os: macos-latest
            platform: macos
            archive: android-control-center-macos-arm64.tar.gz
          - os: ubuntu-24.04
            platform: linux
            archive: android-control-center-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux GUI dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libgtk-3-dev
      - name: Download Android Platform Tools
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            windows) url='https://dl.google.com/android/repository/platform-tools-latest-windows.zip'; ext='zip'; ;;
            macos) url='https://dl.google.com/android/repository/platform-tools-latest-darwin.zip'; ext='zip'; ;;
            linux) url='https://dl.google.com/android/repository/platform-tools-latest-linux.zip'; ext='zip'; ;;
          esac
          curl -fsSL "$url" -o "platform-tools.$ext"
          mkdir -p desktop-companion/resources/adb
          if [ "$ext" = zip ]; then unzip -q -o "platform-tools.$ext"; fi
          cp platform-tools/adb desktop-companion/resources/adb/ 2>/dev/null || cp platform-tools/adb.exe desktop-companion/resources/adb/
          cp platform-tools/AdbWinApi.dll desktop-companion/resources/adb/ 2>/dev/null || true
          cp platform-tools/AdbWinUsbApi.dll desktop-companion/resources/adb/ 2>/dev/null || true
          chmod +x desktop-companion/resources/adb/adb 2>/dev/null || true
      - name: Build native application
        shell: bash
        run: cargo build --manifest-path desktop-companion/Cargo.toml --release
      - name: Package macOS
        if: matrix.platform == 'macos'
        run: |
          mkdir -p android-control-center-macos-arm64/adb
          cp desktop-companion/target/release/android-control-center-desktop android-control-center-macos-arm64/
          cp -R desktop-companion/resources/adb/. android-control-center-macos-arm64/adb/
          tar -czf android-control-center-macos-arm64.tar.gz android-control-center-macos-arm64
      - name: Package Linux
        if: matrix.platform == 'linux'
        run: |
          mkdir -p android-control-center-linux-x64/adb
          cp desktop-companion/target/release/android-control-center-desktop android-control-center-linux-x64/
          cp -R desktop-companion/resources/adb/. android-control-center-linux-x64/adb/
          tar -czf android-control-center-linux-x64.tar.gz android-control-center-linux-x64
      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force android-control-center-windows-x64 | Out-Null
          Copy-Item desktop-companion\target\release\android-control-center-desktop.exe android-control-center-windows-x64\
          Copy-Item desktop-companion\resources\adb android-control-center-windows-x64\adb -Recurse
          Compress-Archive -Path android-control-center-windows-x64 -DestinationPath android-control-center-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: android-control-center-${{ matrix.platform }}
          path: ${{ matrix.archive }}
