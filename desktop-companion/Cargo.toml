[package]
name = "android-control-center-desktop"
version = "0.1.0"
edition = "2021"
description = "A local-first, transparent Android ADB control desk"
license = "MIT"

[dependencies]
eframe = "0.26"
egui = "0.26"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rfd = "0.14"

